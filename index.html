<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Everything ❤️</title>
    <style>
        body {
            background-color: #f7f1eb;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            margin: 20px 0;
        }
        input {
            padding: 10px;
            width: 80%;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-size: 16px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .hidden { display: none; }
        .content { font-size: 18px; color: #333; line-height: 1.8; }
        img {
            width: 100%;
            border-radius: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

        <br>

        <p id="errorMsg" style="color: red; font-size: 14px;"></p>

            <p><strong>سوا من: 16.01.2023</strong></p>
            <p id="counter" style="color: #d9534f; font-weight: bold;"></p>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            
            <p>صورنا الذكريات ✨</p>
            <img src="https://i.ibb.co/fVHT0J4g/IMG-20260215-WA0008.jpg" alt="صورة 1">
            <img src="https://i.ibb.co/jZPPc3bt/IMG-20250611-WA0062.jpg" alt="صورة 2">
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
    </audio>
